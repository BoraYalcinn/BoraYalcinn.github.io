hobbies:
  title: Sports and hobbies
  items:
    - name: Bouldering and climbing
      note: Oddly well suited to gamers and engineers, since every problem is read before it is climbed and the answer is a sequence rather than brute strength. It began on my Erasmus in France, where I met good people and took lessons at Block Session in Belfort, and I have not stopped since.
      image: /images/about/hobbies/bouldering.jpg
    - name: Table tennis
      note: Played seriously through middle school, on the school team and in tournaments across the district, where our best run finished third against schools far larger than ours. Still the sport I would pick over any other to kill an afternoon.
      image: /images/about/hobbies/table-tennis.jpg
    - name: Football
      note: The one fixture that has survived everything since high school. Same group of friends, same five a side pitch, most weekends, and I play on the left wing.
      image: /images/about/hobbies/football.jpg
    - name: Photography
      note: "The same subject as rendering, approached from the other side: depth of field, exposure, how light falls on a surface. Mostly wildlife, birds and landscapes, which means the subject decides when the photograph happens and the only job left is to be ready for it."
      image: /images/about/hobbies/photography.jpg
    - name: Guitar
      note: A year and a bit of lessons now, and still at the stage where progress is measured in chords that stop buzzing rather than in songs. The most humbling thing on this list.
      image: /images/about/hobbies/guitar.jpg
    - name: Retro collecting
      note: Old consoles, the games that shipped on them, and whatever else came in the box. Half the appeal is that this shelf is the history of real time rendering, since every one of these machines answered the same question under a different constraint, and the answers are still there to be held and switched on.
      image: /images/about/hobbies/retro-collecting.jpg
