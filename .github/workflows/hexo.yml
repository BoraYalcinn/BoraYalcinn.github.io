name: Build and deploy

on:
  push:
    branches: [main]
  # Lets you re-run a deploy from the Actions tab without pushing anything,
  # useful because /projects/ reads the GitHub API at build time, so a rebuild
  # is how the repo list picks up new repos and edited descriptions.
  workflow_dispatch:
  # The site is static, so anything fetched at build time is frozen until the
  # next build. A nightly run is what keeps the repo list and the upcoming
  # games section from going stale between pushes.
  schedule:
    - cron: '0 4 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Istanbul
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install dependencies
        run: npm ci

      - name: Log tool versions
        run: |
          node --version
          npx hexo version

      # The theme's stylesheet is authored in Sass; the compiled file is not
      # committed, so it is built here rather than being allowed to go stale.
      - name: Build CSS
        run: npm run build:css

      - name: Build
        env:
          # Read by scripts/repos.js. Unauthenticated, the GitHub API allows 60
          # requests an hour per IP and runners share addresses; with this the
          # limit is far higher. If the call fails anyway the build still
          # succeeds, falling back to source/_data/reposSnapshot.json.
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Read by scripts/games.js for the "releasing next month" section on
          # the home page. If the secret is missing the section is left out and
          # the build still succeeds.
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: |
          npx hexo clean
          npx hexo generate

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
