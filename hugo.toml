  [[menus.main]]
    name = "Blog"
    pageRef = "/blog"
    weight = 10
  [[menus.main]]
    name = "Projects"
    pageRef = "/projects"
    weight = 20
  [[menus.main]]
    name = "Shaders"
    pageRef = "/shaders"
    weight = 25
  [[menus.main]]
    name = "Tags"
    pageRef = "/tags"
    weight = 30
