# Pages CMS (pagescms.org) — the browser-based editor for this site.
# Open https://app.pagescms.org, sign in with GitHub, pick this repo.
#
# Every field below maps to a real front-matter key the layouts read. Adding a
# field here does not make the site use it; check the layouts first.
#
# Two things changed in the move from Hugo to Hexo:
#   - "Draft" became "Published", because Hexo hides a post with
#     `published: false` rather than with `draft: true`. The tick means the
#     opposite of what it used to.
#   - Project and shader pages are folders now (source/shaders/<name>/index.md),
#     which is how Hexo gives a page its own URL, so each collection writes into
#     a subfolder and skips the section's own index.md.

media:
  # Uploads land in source/images/ and are referenced as /images/... , which is
  # how Hexo serves anything under source that it does not render. Video lives
  # here too: one upload source keeps the CMS simple, at the cost of a folder
  # named "images" holding the odd .webm.
  input: source/images
  output: /images
  extensions: [png, jpg, jpeg, gif, webp, svg, webm, mp4]
  rename: safe

content:
  - name: blog
    label: Blog posts
    type: collection
    path: source/_posts
    format: yaml-frontmatter
    subfolders: false
    filename: "{fields.title}.md"
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, published, categories]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: published
        label: Published
        type: boolean
        default: false
        description: "Unticked posts stay off the published site. Tick to publish."
      - name: description
        label: Summary
        type: text
        description: "One line. Shown on cards, in search results and when the link is shared."
      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          values: [Dev, Photography, Life, Cinema, Video Games]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover image
        type: image
      - name: featured
        label: Feature on the home page
        type: boolean
        default: false
        description: "The newest featured post gets the big card at the top of the home page."
      - name: body
        label: Body
      # Markdown olarak düz metin — rich-text DEĞİL. Pages CMS'in zengin metin
      # editörü içeriği HTML'e çevirip markdown'a geri yazıyor ve bu turda
      # kayıplar oluyor: LaTeX'teki \_ kaçışları siliniyor (\text{look\_from}
      # -> \text{lookfrom}), HTML yorumları tamamen düşüyor. Bu alanı düz metin
      # tutmak yazdığın markdown'ın dosyada aynen kalmasını sağlıyor.
        type: text

  - name: shaders
    label: Shaders
    type: collection
    path: source/shaders
    format: yaml-frontmatter
    subfolders: true
    filename: "{fields.title}/index.md"
    exclude: ["index.md"]
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, published, shaderId]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: layout
        label: Layout
        type: string
        default: shader
        description: "Leave as 'shader'. This is what tells Hexo to use the shader page template."
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: published
        label: Published
        type: boolean
        default: false
      - name: description
        label: Summary
        type: text
      - name: shaderId
        label: Shadertoy ID
        type: string
        required: true
        description: "Last part of the shader's URL — shadertoy.com/view/XXXXXX. The embed is added above the text automatically."
      - name: shaderVideo
        label: Recorded loop (webm)
        type: file
        description: "A short screen recording of the shader. Plays muted on loop in place of the live embed — the most reliable option, since it does not depend on Shadertoy being reachable."
      - name: shaderEmbed
        label: Try the live embed
        type: boolean
        default: false
        description: "Off by default: Shadertoy sits behind Cloudflare, which serves a bot challenge to a cross-origin iframe and refuses to be framed. The poster opens the working page instead. Tick to try the embed anyway."
      - name: shaderPaused
        label: Start paused (embed only)
        type: boolean
        default: false
      - name: categories
        label: Categories
        type: select
        options:
          multiple: true
          values: [Dev, Photography, Life, Cinema, Video Games]
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover image
        type: image
      - name: body
        label: Notes
      # Markdown olarak düz metin — rich-text DEĞİL. Pages CMS'in zengin metin
      # editörü içeriği HTML'e çevirip markdown'a geri yazıyor ve bu turda
      # kayıplar oluyor: LaTeX'teki \_ kaçışları siliniyor (\text{look\_from}
      # -> \text{lookfrom}), HTML yorumları tamamen düşüyor. Bu alanı düz metin
      # tutmak yazdığın markdown'ın dosyada aynen kalmasını sağlıyor.
        type: text

  - name: projects
    label: Project write-ups
    type: collection
    path: source/projects
    format: yaml-frontmatter
    subfolders: true
    filename: "{fields.title}/index.md"
    exclude: ["index.md"]
    view:
      primary: title
      sort: date
      order: desc
      fields: [title, date, published, repo]
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: layout
        label: Layout
        type: string
        default: project
        description: "Leave as 'project'. This is what tells Hexo to use the project page template."
      - name: date
        label: Date
        type: date
        options:
          format: yyyy-MM-dd
      - name: published
        label: Published
        type: boolean
        default: false
      - name: repo
        label: GitHub repo name
        type: string
        description: "Exact repo name, e.g. CezveRender. Links this page to the repo: the card gains a Read more button, and language / stars / link are pulled live."
      - name: description
        label: Summary
        type: text
      - name: tags
        label: Tags
        type: string
        list: true
      - name: cover
        label: Cover image
        type: image
      - name: body
        label: Body
      # Markdown olarak düz metin — rich-text DEĞİL. Pages CMS'in zengin metin
      # editörü içeriği HTML'e çevirip markdown'a geri yazıyor ve bu turda
      # kayıplar oluyor: LaTeX'teki \_ kaçışları siliniyor (\text{look\_from}
      # -> \text{lookfrom}), HTML yorumları tamamen düşüyor. Bu alanı düz metin
      # tutmak yazdığın markdown'ın dosyada aynen kalmasını sağlıyor.
        type: text

  # --- single files -------------------------------------------------------
  - name: home
    label: Home page (about me)
    type: file
    path: source/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Site title
        type: string
      - name: layout
        label: Layout
        type: string
        default: home
      - name: body
        label: About me
        type: text
        description: "Shows on the home page, above the latest post."

  - name: projects_index
    label: Projects page intro
    type: file
    path: source/projects/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
      - name: layout
        label: Layout
        type: string
        default: projects
      - name: description
        label: Summary
        type: text
      - name: body
        label: Intro text
        type: text

  - name: shaders_index
    label: Shaders page intro
    type: file
    path: source/shaders/index.md
    format: yaml-frontmatter
    fields:
      - name: title
        label: Title
        type: string
      - name: layout
        label: Layout
        type: string
        default: shaders
      - name: description
        label: Summary
        type: text
      - name: body
        label: Intro text
        type: text

  - name: featured_repos
    label: Featured projects & repo list
    type: file
    path: source/_data/projects.yml
    format: yaml
    fields:
      - name: user
        label: GitHub username
        type: string
      - name: featured
        label: Featured repos
        type: string
        list: true
        description: "Repo names, in the order they should appear as big cards."
      - name: hidden
        label: Hidden repos
        type: string
        list: true
      - name: showForks
        label: Forks to show anyway
        type: string
        list: true
      - name: overrides
        label: Per-repo overrides
        type: object
        list: true
        description: "Replace what GitHub reports for one repo. Leave a field empty to keep GitHub's own value."
        fields:
          - name: repo
            label: Repo name
            type: string
            required: true
          - name: title
            label: Display title
            type: string
          - name: description
            label: Description
            type: text
          - name: cover
            label: Thumbnail
            type: image
            description: "Shown next to the repo in the list, and as the card image if the repo is featured."
          - name: tags
            label: Technologies
            type: string
            list: true
            description: "Language, libraries and frameworks the repo is built on — lowercase and hyphenated, e.g. c++, sdl2, opengl. A tag that just repeats GitHub's own language badge is not shown twice. A repo that has a write-up page takes that page's tags when this is left empty."
