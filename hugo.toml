baseURL = "https://borayalcinn.github.io/"
locale = "en-us"
title = "Bora Yalçın"
theme = "retrocss"
copyright = "© 2026 Bora Yalçın"
enableRobotsTXT = true
enableEmoji = true

# Hugo does not merge a theme's markup/outputs config into the site's, so the
# two settings RetroCSS 9x needs have to live here rather than in the theme.
capitalizeListTitles = false

[markup.goldmark.renderer]
  unsafe = true

# Math in posts. `passthrough` stops Goldmark from touching what sits between
# the delimiters — without it, an underscore inside \text{look_from} turns into
# emphasis and the formula is mangled before it is ever rendered. The rendering
# itself happens at build time in layouts/_markup/render-passthrough.html, using
# the KaTeX that ships inside Hugo, so no script or stylesheet is loaded.
[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block = [['$$', '$$'], ['\\[', '\\]']]
    # Inline math is \(...\) only. A bare $...$ pair would also make "$5 to $10"
    # in an ordinary sentence render as a formula.
    inline = [['\\(', '\\)']]

[pagination]
  pagerSize = 6

[params]
  tagline = "computer graphics, engine architecture, game development"
  description = "Bora Yalçın — CSE undergraduate working in computer graphics, engine architecture and game development. Building BarelyAnEngine and contributing rendering fixes to Godot Engine."
  # Matches the light look of the theme's own demo site.
  accentHue = "primary"
  borderRadius = "0"
  sidebar = "left"
  dateFormat = "2 January 2006"
  showReadingTime = true
  showToc = true
  search = true
  # The home page and every "all posts" listing read from this.
  mainSections = ["blog"]

  [params.author]
    name = "Bora Yalçın"
    initials = "BY"
    bio = "Undergraduate CSE student at Yeditepe University (Istanbul), currently on an Erasmus+ exchange at UTBM, France. Works in computer graphics, engine architecture, and game development. Building BarelyAnEngine (a minimal-dependency C++ software renderer) and contributing rendering fixes to Godot Engine's Compatibility/GLES3 renderer. Also shoots photography and writes shaders on Shadertoy."

# Read by layouts/partials/social-links.html. `icon` selects an inline SVG from
# that partial's icon table — adding a network means adding a path there too.
[[params.social]]
  name = "GitHub"
  url = "https://github.com/BoraYalcinn"
  icon = "github"
[[params.social]]
  name = "LinkedIn"
  url = "https://www.linkedin.com/in/borayalcinn/"
  icon = "linkedin"
[[params.social]]
  name = "YouTube"
  url = "https://www.youtube.com/@BoraY5734"
  icon = "youtube"
[[params.social]]
  name = "Behance"
  url = "https://www.behance.net/USERNAME"
  icon = "behance"
[[params.social]]
  name = "Steam"
  url = "https://steamcommunity.com/profiles/76561198385728537/"
  icon = "steam"

# Comments, via giscus — each page gets a GitHub Discussion in the "Comments"
# category, matched by pathname. The two ids are GitHub's own node ids, read
# from giscus.app; they are public identifiers, not secrets.
[params.comments]
  provider = "giscus"
  [params.comments.giscus]
    repo = "BoraYalcinn/BoraYalcinn.github.io"
    repoId = "R_kgDOTq2BCA"
    category = "Comments"
    categoryId = "DIC_kwDOTq2BCM4DFuDa"
    mapping = "pathname"
    # Matches the site default; the sync script in comments.html follows the toggle.
    theme = "light"

