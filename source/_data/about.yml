# The rows on /about/ under the written part: three scrollable shelves of
# favourites, then the sports and hobbies cards.
#
# Each item needs a `title`; everything else is optional.
#
# `image` is resolved against what is actually in source/ at build time, and the
# extension in it is only a hint: a file saved as .webp, .png or .avif under the
# same name is found just the same. An item whose file is missing renders as a
# name-only tile rather than a broken image, so a row can be filled in over
# time.
#
# `url` is optional and turns a tile into a link.
#
# `aspect` is the shape every tile in that row is cropped to, so a row stays
# even however the source images are sized: 2 / 3 for film and series posters,
# 3 / 4 for game box art.

